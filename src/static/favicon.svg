<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="24" fill="#F8F5F2"/>
  <rect x="4" y="4" width="92" height="92" rx="20" fill="none" stroke="#E8D5CB" stroke-width="2"/>
  <!-- Two intertwined wedding rings -->
  <!-- Left ring -->
  <circle cx="41" cy="53" r="19" fill="none" stroke="#8C6A5D" stroke-width="5.5"/>
  <!-- Right ring -->
  <circle cx="59" cy="47" r="19" fill="none" stroke="#8C6A5D" stroke-width="5.5"/>
