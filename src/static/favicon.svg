  <path d="M 46 35 A 19 19 0 0 1 58 40" fill="none" stroke="#8C6A5D" stroke-width="5.5"/>
  <!-- Gem / Sparkle on top of right ring -->
  <path d="M59 21 L61 25 L65 27 L61 29 L59 33 L57 29 L53 27 L57 25 Z" fill="#C07D38"/>
</svg>